<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wygor alves</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { color: inherit; }

    :root {
      --bg: #000000;
      --text: #b8b8b8;
      --dim: #6e6e6e;
      --accent: #e0e0e0;
      --cursor: #e0e0e0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .terminal {
      width: 100%;
      max-width: 560px;
    }

    /* ── identity ── */
    .identity {
      margin-bottom: 32px;
    }

    .name {
      font-size: 17px;
      color: var(--accent);
      font-weight: normal;
      letter-spacing: 0.04em;
    }

    .role {
      color: var(--dim);
      font-size: 14px;
      margin-top: 2px;
    }

    /* ── socials ── */
    .socials {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      font-size: 14px;
    }

    .socials a {
      color: var(--dim);
      text-decoration: none;
      transition: color 150ms;
    }

    .socials a:hover {
      color: var(--accent);
    }

    /* ── separator ── */
    .sep {
      color: var(--dim);
      margin: 28px 0;
      font-size: 12px;
      opacity: 0.4;
      user-select: none;
    }

    /* ── prompt area ── */
    .prompt-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }

    .prompt-symbol {
      color: var(--dim);
      flex-shrink: 0;
      user-select: none;
    }

    .input-field {
      background: none;
      border: none;
      outline: none;
      color: var(--accent);
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      width: 100%;
      caret-color: var(--cursor);
    }

    .input-field::placeholder {
      color: #444;
    }

    /* ── output ── */
    .output {
      margin-top: 20px;
      min-height: 20px;
    }

    .output-line {
      color: var(--text);
      font-size: 14px;
      line-height: 1.8;
    }

    .output-line.heading {
      color: var(--accent);
      margin-top: 12px;
      margin-bottom: 2px;
    }

    .output-line.heading:first-child {
      margin-top: 0;
    }

    .output-line.dim {
      color: var(--dim);
    }

    .output-line.cmd {
      color: #e8e8e8;
      margin-bottom: 2px;
    }

    .output-line a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid #333;
      transition: color 150ms, border-color 150ms;
    }

    .output-line a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .output-gap {
      height: 10px;
    }

    /* ── helper ── */
    .helper {
      margin-top: 20px;
      font-size: 12px;
      color: #4a4a4a;
      user-select: none;
    }

    /* ── responsive ── */
    @media (max-width: 480px) {
      body { padding: 20px; }
      .terminal { max-width: 100%; }
      .socials { flex-wrap: wrap; gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="identity">
      <div class="name">wygor alves</div>
      <div class="role">technical ai product manager</div>

      <div class="socials">
        <a href="mailto:wygor96@gmail.com">email</a>
        <a href="https://linkedin.com/in/wygor" target="_blank" rel="noopener">linkedin</a>
        <a href="https://panesade.com" target="_blank" rel="noopener">panesade.com</a>
        <a href="https://wygg.cc" target="_blank" rel="noopener">wygg.cc</a>
        <a href="https://github.com/wygoralves" target="_blank" rel="noopener">github</a>
      </div>
    </div>

    <div class="prompt-line">
      <span class="prompt-symbol">$</span>
      <input class="input-field" type="text" placeholder="type help" autofocus autocomplete="off" spellcheck="false" id="cmd">
    </div>

    <div class="output" id="output"></div>
    <div class="helper" id="helper"></div>
  </div>

  <script>
    const sections = ['about', 'work', 'projects', 'contact'];
    let sectionIndex = -1; // -1 = help

    const commands = {
      about:    { desc: 'who i am',        alias: 'a' },
      work:     { desc: 'career history',  alias: 'w' },
      projects: { desc: 'things i built',  alias: 'p' },
      contact:  { desc: 'get in touch',    alias: 'c' },
      clear:    { desc: 'clear screen',    alias: null },
      help:     { desc: 'show commands',   alias: 'h' },
    };

    const cmdNames = Object.keys(commands);
    const aliasMap = {};
    for (const [name, cmd] of Object.entries(commands)) {
      if (cmd.alias) aliasMap[cmd.alias] = name;
    }

    const data = {
      help: (() => {
        const lines = [
          { type: 'cmd', text: 'available commands:' },
          { type: 'gap' },
        ];
        for (const [name, cmd] of Object.entries(commands)) {
          if (name === 'help') continue;
          const label = cmd.alias ? `${name} (${cmd.alias})` : name;
          lines.push({ type: 'line', text: `  ${label.padEnd(16)}- ${cmd.desc}` });
        }
        return lines;
      })(),

      about: [
        { type: 'heading', text: 'about' },
        { type: 'gap' },
        { type: 'line', text: 'massive nerd. technical pm who loves to learn,' },
        { type: 'line', text: 'code, and architect the future of software.' },
        { type: 'line', text: 'ai-native builder using llms to accelerate' },
        { type: 'line', text: 'execution since gpt-3.5.' },
        { type: 'gap' },
        { type: 'line', text: 'hands-on in js, sql, python, and ai coding tools.' },
        { type: 'line', text: '5 years managing products nonstop.' },
        { type: 'gap' },
        { type: 'dim', text: '5y pm · 5k+ workshops · 14k+ users · arpa +62% · nps -11→42' },
      ],

      work: [
        { type: 'heading', text: 'work' },
        { type: 'gap' },
        { type: 'line', text: '  2025–now   founder & hybrid product engineer' },
        { type: 'dim',  text: '             wygg.cc · solo "one-man squad"' },
        { type: 'gap' },
        { type: 'line', text: '  2023–now   group product manager' },
        { type: 'dim',  text: '             cilia tecnologia · goiânia' },
        { type: 'gap' },
        { type: 'line', text: '  2022–2023  product manager' },
        { type: 'dim',  text: '             palqee technologies · london (remote)' },
        { type: 'gap' },
        { type: 'line', text: '  2021–2022  product manager' },
        { type: 'dim',  text: '             nectarcrm · goiânia' },
        { type: 'gap' },
        { type: 'line', text: '  2018–2021  ux researcher → product owner' },
        { type: 'dim',  text: '             nectarcrm' },
      ],

      projects: [
        { type: 'heading', text: 'projects' },
        { type: 'gap' },
        { type: 'line', html: '  <a href="https://panesade.com" target="_blank" rel="noopener">panesade.com</a>    local-first cockpit for ai-assisted coding' },
        { type: 'dim',  text: '                   tauri + react. chat, git, terminal, editor.' },
        { type: 'dim',  text: '                   built solo. open source. live.' },
        { type: 'gap' },
        { type: 'line', html: '  <a href="https://wygg.cc" target="_blank" rel="noopener">wygg.cc</a>          fast, minimal whiteboard to draw & diagram' },
        { type: 'dim',  text: '                   ai generation, smart connectors, mermaid.' },
        { type: 'dim',  text: '                   built solo. freemium. live.' },
      ],

      contact: [
        { type: 'heading', text: 'contact' },
        { type: 'gap' },
        { type: 'line', html: '  email      <a href="mailto:wygor96@gmail.com">wygor96@gmail.com</a>' },
        { type: 'line', html: '  linkedin   <a href="https://linkedin.com/in/wygor" target="_blank" rel="noopener">linkedin.com/in/wygor</a>' },
        { type: 'line', html: '  web        <a href="https://wygg.cc" target="_blank" rel="noopener">wygg.cc</a>' },
        { type: 'line', html: '  github     <a href="https://github.com/wygoralves" target="_blank" rel="noopener">github.com/wygoralves</a>' },
      ],
    };

    const input = document.getElementById('cmd');
    const output = document.getElementById('output');
    const helper = document.getElementById('helper');

    function render(lines) {
      let html = '';
      for (const l of lines) {
        if (l.type === 'gap') {
          html += '<div class="output-gap"></div>';
        } else if (l.type === 'heading') {
          html += `<div class="output-line heading">${l.text}</div>`;
        } else if (l.type === 'cmd') {
          html += `<div class="output-line cmd">${l.text}</div>`;
        } else if (l.type === 'dim') {
          html += `<div class="output-line dim">${l.html || esc(l.text)}</div>`;
        } else {
          html += `<div class="output-line">${l.html || esc(l.text)}</div>`;
        }
      }
      output.innerHTML = html;
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function resolve(raw) {
      const v = raw.trim().toLowerCase();
      if (aliasMap[v]) return aliasMap[v];
      if (data[v] || v === 'clear') return v;
      const match = cmdNames.filter(n => n.startsWith(v));
      if (match.length === 1) return match[0];
      return v;
    }

    function updateHelper() {
      if (sectionIndex === -1) {
        helper.textContent = 'arrow keys to browse sections';
      } else {
        const current = sections[sectionIndex];
        const pos = `${sectionIndex + 1}/${sections.length}`;
        helper.textContent = `${current} (${pos}) · esc to go back`;
      }
    }

    function showSection(index) {
      sectionIndex = index;
      if (index === -1) {
        render(data.help);
      } else {
        render(data[sections[index]]);
      }
      updateHelper();
    }

    function exec(raw) {
      const cmd = resolve(raw);

      if (cmd === 'clear') {
        output.innerHTML = '';
        sectionIndex = -1;
        updateHelper();
        return;
      }

      if (cmd === 'help') {
        showSection(-1);
        return;
      }

      if (data[cmd]) {
        const idx = sections.indexOf(cmd);
        sectionIndex = idx !== -1 ? idx : -1;
        render(data[cmd]);
        updateHelper();
      } else if (raw.trim() === '') {
        // noop
      } else {
        const suggestion = cmdNames.find(n => n.includes(raw.trim().toLowerCase()));
        let msg = `command not found: ${esc(raw.trim())}. type help.`;
        if (suggestion) msg = `command not found: ${esc(raw.trim())}. did you mean "${suggestion}"?`;
        output.innerHTML = `<div class="output-line dim">${msg}</div>`;
      }
    }

    document.addEventListener('keydown', (e) => {
      // esc → back to help
      if (e.key === 'Escape') {
        e.preventDefault();
        input.value = '';
        showSection(-1);
        input.focus();
        return;
      }

      // only handle arrows when input is empty (not typing)
      if (input.value === '') {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          const next = sectionIndex + 1;
          if (next < sections.length) showSection(next);
          return;
        }

        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          const prev = sectionIndex - 1;
          if (prev >= -1) showSection(prev);
          return;
        }
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const raw = input.value;
        input.value = '';
        if (raw.trim()) exec(raw);
        return;
      }

      // tab completion
      if (e.key === 'Tab') {
        e.preventDefault();
        const v = input.value.trim().toLowerCase();
        if (!v) return;
        const matches = cmdNames.filter(n => n.startsWith(v));
        if (matches.length === 1) input.value = matches[0];
        return;
      }
    });

    // clicking anywhere focuses input
    document.body.addEventListener('click', () => input.focus());

    // start on help
    showSection(-1);
  </script>
</body>
</html>
